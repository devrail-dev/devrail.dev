<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      .bg { fill: #0d0d1a; }
      .terminal-bg { fill: #111122; }
      .terminal-border { fill: none; stroke: #00e5a0; stroke-width: 6; }
      .titlebar { fill: #1a1a2e; }
      .dot { fill: #ff3e3e; }
      .dot-yellow { fill: #f5a623; }
      .dot-green { fill: #00e5a0; }
      .prompt { fill: #00e5a0; font-family: monospace; font-size: 48px; font-weight: 700; }
      .cursor { fill: #00e5a0; }
      .rail { fill: none; stroke: #00e5a0; stroke-width: 8; stroke-linecap: round; }
      .tie { fill: none; stroke: #c8d6e5; stroke-width: 6; stroke-linecap: round; opacity: 0.4; }
    </style>
  </defs>

  <!-- Background circle (for GitHub round crop) -->
  <circle cx="256" cy="256" r="256" class="bg"/>

  <!-- Terminal window -->
  <rect x="96" y="100" width="320" height="200" rx="12" class="terminal-bg"/>
  <rect x="96" y="100" width="320" height="200" rx="12" class="terminal-border"/>

  <!-- Title bar -->
  <rect x="99" y="103" width="314" height="36" rx="9" class="titlebar"/>
  <circle cx="124" cy="121" r="7" class="dot"/>
  <circle cx="146" cy="121" r="7" class="dot-yellow"/>
  <circle cx="168" cy="121" r="7" class="dot-green"/>

  <!-- Prompt text -->
  <text x="124" y="230" class="prompt">$ _</text>

  <!-- Cursor blink block -->
  <rect x="222" y="205" width="24" height="32" class="cursor" opacity="0.6"/>

  <!-- Railroad ties (cross beams) -->
  <line x1="120" y1="348" x2="120" y2="390" class="tie"/>
  <line x1="168" y1="348" x2="168" y2="390" class="tie"/>
  <line x1="216" y1="348" x2="216" y2="390" class="tie"/>
  <line x1="264" y1="348" x2="264" y2="390" class="tie"/>
  <line x1="312" y1="348" x2="312" y2="390" class="tie"/>
  <line x1="360" y1="348" x2="360" y2="390" class="tie"/>

  <!-- Rails (two parallel lines) -->
  <line x1="80" y1="356" x2="432" y2="356" class="rail"/>
  <line x1="80" y1="382" x2="432" y2="382" class="rail"/>
</svg>
